<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOID SURVIVOR — ローグライク・サバイバル</title>
<style>
:root{--bg:#070b17;--panel:rgba(12,18,38,.92);--line:rgba(132,164,255,.23);--cyan:#63f4ff;--pink:#ff5ebc;--gold:#ffd879;--text:#f1f5ff;--muted:#a4b1d3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#17214a 0%,#090d1d 55%,#050711 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:18px 12px 26px}.app{width:min(1100px,100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 12px}.brand{font-size:clamp(18px,3vw,28px);font-weight:950;letter-spacing:.12em}.brand span{color:var(--cyan);text-shadow:0 0 20px #35dfff80}.sub{font-size:11px;color:var(--muted);letter-spacing:.18em;margin-top:2px}.topright{display:flex;gap:8px;align-items:center}.chip{border:1px solid var(--line);background:#10172d;border-radius:999px;padding:7px 11px;color:#bdc9ed;font-size:12px}
.shell{position:relative;border:1px solid #7d99f733;border-radius:18px;overflow:hidden;background:#080d1c;box-shadow:0 18px 60px #0009,0 0 36px #263f8730}
canvas{display:block;width:100%;height:auto;aspect-ratio:1000/650;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,7,18,.68);backdrop-filter:blur(7px);z-index:5}.overlay.hidden{display:none}.panel{width:min(560px,100%);max-height:100%;overflow:auto;background:linear-gradient(145deg,rgba(19,28,58,.97),rgba(8,13,29,.98));border:1px solid #8da8ff45;border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 20px 65px #0009;text-align:center}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:.25em;font-weight:800}.panel h1{margin:8px 0 7px;font-size:clamp(28px,5vw,44px);line-height:1;font-weight:1000;letter-spacing:.02em}.panel h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 24px #42dfff6e}.panel p{color:#b7c4e6;line-height:1.75;font-size:14px;margin:12px 0 19px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 20px}.control{padding:11px 7px;border:1px solid #849aff26;background:#ffffff05;border-radius:11px;color:#aebde2;font-size:11px}.control b{display:block;color:white;font-size:13px;margin-bottom:3px}.key{display:inline-block;padding:3px 6px;background:#202b4b;border:1px solid #8aa4ff40;border-radius:5px;color:white;font-weight:800;font-size:12px;margin:1px}
.manual{margin:13px 0;text-align:left;border:1px solid #84a0ee42;border-radius:12px;background:#ffffff05;padding:12px 14px}.manual summary{cursor:pointer;color:var(--cyan);font-weight:900;font-size:13px;text-align:left}.manual-body{margin-top:11px;color:#b9c7e8;font-size:12px;line-height:1.7}.manual-body h3{color:#fff;font-size:12px;margin:11px 0 4px}.manual-body p{font-size:12px;margin:4px 0 8px;line-height:1.7}.manual-body ul{margin:4px 0 9px;padding-left:19px}.manual-body li{margin:3px 0}button{font:inherit;cursor:pointer;border:0}.primary{width:100%;border-radius:11px;padding:14px 18px;background:linear-gradient(100deg,#65eafa,#8f9bff);color:#071021;font-size:15px;font-weight:950;letter-spacing:.04em;box-shadow:0 5px 25px #57dcff27;transition:transform .15s,filter .15s}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.secondary{margin-top:9px;width:100%;padding:10px;border:1px solid #7187c33d;border-radius:10px;background:#ffffff07;color:#cbd5f4;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:17px}.upgrade{min-height:158px;padding:16px 12px;border-radius:13px;background:linear-gradient(160deg,#1a2649,#10172c);border:1px solid #91aaff36;color:white;text-align:left;transition:transform .15s,border-color .15s,background .15s}.upgrade:hover{transform:translateY(-3px);border-color:var(--cyan);background:linear-gradient(160deg,#243662,#111a33)}.upgrade .ico{font-size:25px}.upgrade strong{display:block;font-size:14px;margin:8px 0}.upgrade small{display:block;line-height:1.55;color:#aebde0;font-size:11px}.upgrade .tag{display:inline-block;color:var(--cyan);font-size:9px;letter-spacing:.12em;margin-top:9px}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.stat{background:#ffffff08;border:1px solid #90a4ef25;border-radius:9px;padding:8px 12px;min-width:90px}.stat span{display:block;color:#9eadd5;font-size:10px;letter-spacing:.1em}.stat b{font-size:19px}.footnote{color:#8190b5;font-size:10px;margin-top:14px}.speedbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 3px 0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(10,16,34,.84)}.speed-label{font-size:12px;font-weight:800;color:#b8c7ed;margin-right:3px}.speed-btn{min-width:52px;padding:7px 12px;border:1px solid #7588c34a;border-radius:8px;background:#121b36;color:#c9d6fa;font-size:12px;font-weight:900;transition:background .15s,border-color .15s,transform .15s}.speed-btn:hover{border-color:var(--cyan);transform:translateY(-1px)}.speed-btn.active{background:linear-gradient(100deg,#65eafa,#8f9bff);border-color:#8cf5ff;color:#071021;box-shadow:0 0 16px #57dcff20}.speed-hint{font-size:10px;color:#8293bb;margin-left:5px}.difficulty-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:15px 0 17px}.difficulty-btn{padding:11px 5px;border:1px solid #7588c34a;border-radius:9px;background:#121b36;color:#c9d6fa;min-width:0}.difficulty-btn strong{display:block;font-size:12px}.difficulty-btn small{display:block;font-size:10px;color:#9aacca;margin-top:4px}.difficulty-btn.active{background:linear-gradient(145deg,#203a60,#172849);border-color:var(--cyan);box-shadow:0 0 16px #57dcff20}.difficulty-btn.active small{color:#b9faff}
.mobile-controls{display:none;align-items:center;justify-content:space-between;gap:16px;margin:10px 2px 2px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,34,.9);touch-action:none;user-select:none;-webkit-user-select:none}.joystick-zone{position:relative;flex:0 0 124px;width:124px;height:124px;border-radius:50%;border:2px solid #7c9beb60;background:radial-gradient(circle,#1d2d50 0%,#111a32 70%);box-shadow:inset 0 0 18px #0007;touch-action:none}.joystick-zone:before,.joystick-zone:after{content:"";position:absolute;background:#7c9beb24;pointer-events:none}.joystick-zone:before{width:1px;height:86%;left:50%;top:7%}.joystick-zone:after{height:1px;width:86%;left:7%;top:50%}.stick-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #bafaff;background:linear-gradient(145deg,#67e9f7,#607df5);box-shadow:0 2px 16px #42dfff65;pointer-events:none}.touch-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:104px;flex:1}.touch-action{border:1px solid #7d9bdf66;border-radius:12px;padding:14px 10px;background:linear-gradient(145deg,#202e50,#141c34);color:#e5efff;font-weight:900;font-size:14px;min-height:48px;touch-action:none}.touch-action:active{transform:scale(.97);background:#29466a}.touch-help{font-size:10px;color:#899bc4;text-align:center}@media(pointer:coarse),(max-width:760px){.mobile-controls{display:flex}}@media(max-width:570px){.difficulty-options{grid-template-columns:repeat(2,minmax(0,1fr))}.difficulty-btn{padding:9px 4px}body{padding:8px 6px 18px}.shell{border-radius:12px}.cards{grid-template-columns:1fr}.upgrade{min-height:auto;display:grid;grid-template-columns:42px 1fr;column-gap:8px;padding:11px}.upgrade .ico{grid-row:span 3;align-self:center}.upgrade strong{margin:2px 0}.upgrade small{font-size:11px}.upgrade .tag{margin-top:4px}.control{padding:8px 3px}.chip{font-size:10px;padding:6px 8px}.sub{font-size:9px}.speedbar{gap:5px;padding:8px}.speed-btn{min-width:44px;padding:7px 8px}.speed-hint{width:100%;text-align:center;margin:2px 0 0}.mobile-controls{gap:10px;padding:8px}.joystick-zone{flex-basis:112px;width:112px;height:112px}.touch-actions{min-width:95px}.touch-action{padding:12px 8px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">VOID <span>SURVIVOR</span></div><div class="sub">INFINITE WORLD / AUTO-ATTACK ROGUELITE</div></div><div class="topright"><div class="chip">RUN <b id="runNo">01</b></div><div class="chip">BEST <b id="bestScore">0</b></div></div></header>
<div class="shell">
<canvas id="game" width="1000" height="650" aria-label="VOID SURVIVOR game area"></canvas>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
</div>
<div class="mobile-controls" id="mobileControls" aria-label="スマホ操作"><div class="joystick-zone" id="joystick" role="application" aria-label="移動スティック"><div class="stick-knob" id="stickKnob"></div></div><div class="touch-actions"><button type="button" class="touch-action" id="dashTouch">⚡ ダッシュ</button><button type="button" class="touch-action" id="pauseTouch">Ⅱ 一時停止</button><div class="touch-help">左のスティックで移動</div></div></div>
<div class="speedbar" id="speedbar" aria-label="ゲーム速度"><span class="speed-label">ゲーム速度</span><button type="button" class="speed-btn active" data-speed="1" aria-pressed="true">1×</button><button type="button" class="speed-btn" data-speed="2" aria-pressed="false">2×</button><button type="button" class="speed-btn" data-speed="3" aria-pressed="false">3×</button><button type="button" class="speed-btn" data-speed="4" aria-pressed="false">4×</button><span class="speed-hint">敵・攻撃・ゲーム内時間が選択した速度で進みます</span></div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 3px 0;color:#8998bf;font-size:11px"><span>移動：WASD / 矢印キー　・　ダッシュ：SPACE　・　ポーズ：P</span><span>すべての攻撃は自動</span></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
const W=canvas.width,H=canvas.height;
const keys=new Set();
let touchAxisX=0,touchAxisY=0,joystickPointerId=null;
let mode='menu',last=0,elapsed=0,spawnClock=0,fireClock=0,orbitAngle=0,shake=0,runNo=1,kills=0,score=0,totalDamage=0,nextBossAt=120,endlessMode=false,gameSpeed=1;
let difficulty='normal';
const difficultyConfig={easy:{label:'イージー',hpMultiplier:.7,damageMultiplier:.7},normal:{label:'ノーマル',hpMultiplier:1,damageMultiplier:1},hard:{label:'ハード',hpMultiplier:1.3,damageMultiplier:1.3},master:{label:'マスター',hpMultiplier:1.7,damageMultiplier:1.7},ultimate:{label:'アルティメット',hpMultiplier:2,damageMultiplier:2}};
let player,enemies,shots,enemyShots,xps,particles,orbs,shockwaves,effects,bosses,upgradesTaken,chests;
let cameraX=0,cameraY=0,obstacles=[],generatedChunks=new Set(),lastChunkKey='',lastShotSfxAt=0,lastHitSfxAt=0;
const CHUNK_W=700,CHUNK_H=500;
let best=0;try{best=Number(window.localStorage.getItem('voidSurvivorBest')||0)}catch(e){best=0;}
document.getElementById('bestScore').textContent=best.toLocaleString();
document.getElementById('runNo').textContent=String(runNo).padStart(2,'0');
let audioCtx=null,soundOn=true;
function beep(freq=440,dur=.055,type='sine',vol=.025,delay=0){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=audioCtx.currentTime+Math.max(0,delay),peak=clamp(vol*1.8,.0005,.18);o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(peak,start+Math.min(.008,dur*.25));g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+dur+.01)}catch(e){}}
function sfxShot(){const now=performance.now();if(now-lastShotSfxAt<65)return;lastShotSfxAt=now;beep(620+Math.random()*200,.045,'square',.018);beep(240,.035,'sine',.01,.012)}
function sfxHit(){const now=performance.now();if(now-lastHitSfxAt<65)return;lastHitSfxAt=now;beep(170+Math.random()*95,.045,'triangle',.026);beep(85,.055,'sine',.012,.008)}
function sfxChest(){[[392,.16,'triangle',.035,0],[523,.18,'triangle',.04,.08],[659,.2,'triangle',.04,.16],[784,.25,'sine',.04,.24],[1047,.34,'sine',.045,.35],[1318,.28,'triangle',.025,.48]].forEach(n=>beep(...n));}
function sfxVictory(){[[523,.3,'triangle',.035,0],[659,.3,'triangle',.035,.08],[784,.35,'triangle',.04,.16],[659,.25,'sine',.035,.36],[784,.3,'sine',.04,.43],[988,.35,'triangle',.045,.5],[784,.38,'sine',.04,.75],[988,.38,'sine',.04,.82],[1175,.42,'triangle',.045,.9],[1568,.6,'sine',.05,1.02]].forEach(n=>beep(...n));}
function sfxGameOver(){beep(165,.28,'sawtooth',.045);beep(110,.45,'triangle',.04,.12);}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function collidesObstacle(x,y,r){for(const o of obstacles){const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);if((x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r)return true;}return false;}
function rectTouchesCircle(rx,ry,rw,rh,cx,cy,cr){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny)<cr*cr;}
function rectsOverlap(a,b,pad=0){return a.x-pad<b.x+b.w&&a.x+a.w+pad>b.x&&a.y-pad<b.y+b.h&&a.y+a.h+pad>b.y;}
function makeChunk(cx,cy){const key=`${cx},${cy}`;if(generatedChunks.has(key))return;generatedChunks.add(key);let seed=(((cx*73856093)^(cy*19349663))>>>0)||1;const rnd=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;};const count=3+Math.floor(rnd()*5);for(let i=0;i<count;i++){const w=28+rnd()*44,h=24+rnd()*44,x=cx*CHUNK_W+18+rnd()*(CHUNK_W-w-36),y=cy*CHUNK_H+18+rnd()*(CHUNK_H-h-36),candidate={x,y,w,h};if(player&&rectTouchesCircle(x,y,w,h,player.x,player.y,player.r+48))continue;if(Array.isArray(enemies)&&enemies.some(e=>rectTouchesCircle(x,y,w,h,e.x,e.y,e.r+8)))continue;if(obstacles.some(o=>rectsOverlap(candidate,o,8)))continue;obstacles.push({x,y,w,h,type:['rock','crystal','ruin'][Math.floor(rnd()*3)],key,seed:rnd()});}}
function ensureWorldChunks(force=false){if(!player)return;const cx=Math.floor(player.x/CHUNK_W),cy=Math.floor(player.y/CHUNK_H),key=`${cx},${cy}`;if(!force&&key===lastChunkKey)return;for(let xx=cx-2;xx<=cx+2;xx++)for(let yy=cy-2;yy<=cy+2;yy++)makeChunk(xx,yy);if(generatedChunks.size>100){for(const k of [...generatedChunks]){const [xx,yy]=k.split(',').map(Number);if(Math.abs(xx-cx)>3||Math.abs(yy-cy)>3)generatedChunks.delete(k);}obstacles=obstacles.filter(o=>generatedChunks.has(o.key));}lastChunkKey=key;}
function findStatueSpawn(){for(let i=0;i<80;i++){const x=cameraX+rand(58,W-58),y=cameraY+rand(70,H-65);if(Math.hypot(x-player.x,y-player.y)>230&&!collidesObstacle(x,y,23)&&!enemies.some(e=>Math.hypot(x-e.x,y-e.y)<e.r+24))return{x,y};}return null;}
function outsideCamera(x,y,r){return x<cameraX-r||x>cameraX+W+r||y<cameraY-r||y>cameraY+H+r;}
function findEnemySpawn(r){for(let i=0;i<180;i++){const side=Math.floor(Math.random()*4),gap=r+18;let x,y;if(side===0){x=rand(cameraX-r,cameraX+W+r);y=cameraY-gap;}else if(side===1){x=cameraX+W+gap;y=rand(cameraY-r,cameraY+H+r);}else if(side===2){x=rand(cameraX-r,cameraX+W+r);y=cameraY+H+gap;}else{x=cameraX-gap;y=rand(cameraY-r,cameraY+H+r);}if(outsideCamera(x,y,r+3)&&!collidesObstacle(x,y,r+4))return{x,y};}return null;}
function findPackSpawn(cx,cy,r,already=[]){for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,d=rand(28,95),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;if(!outsideCamera(x,y,r+2)||collidesObstacle(x,y,r+4)||Math.hypot(x-player.x,y-player.y)<Math.min(W,H)*.42)continue;if(already.some(e=>Math.hypot(x-e.x,y-e.y)<r+e.r+7))continue;return{x,y};}return null;}
function initRun(){elapsed=0;spawnClock=.4;fireClock=.2;orbitAngle=0;shake=0;kills=0;score=0;totalDamage=0;nextBossAt=120;endlessMode=false;upgradesTaken=[];
player={x:W/2,y:H/2,r:14,hp:100,maxHp:100,speed:228,damage:22,fireRate:.62,projectileSpeed:470,projectileSize:5,projectiles:1,projectilePierce:0,crit:.06,magnet:90,armor:0,regen:0,orbit:0,orbitDamage:18,orbitDamageBonus:1,orbitSizeBonus:1,orbitRangeBonus:1,area:1,moveBoost:0,invuln:0,dashCd:0,dashTime:0,dashCooldown:1.15,xpBonus:1,lifesteal:0,damageReduction:0,revive:0,fireballLevel:0,fireballClock:.35,fireballProjectiles:1,fireballDamageBonus:1,fireballSize:8,fireballAreaBonus:1,fireballRateBonus:1,lightningLevel:0,lightningClock:.7,lightningDamageBonus:1,lightningExtraChains:0,lightningRateBonus:1,lightningRange:145,frostLevel:0,frostClock:1.2,frostDamageBonus:1,frostAreaBonus:1,frostSlowBonus:1,frostRateBonus:1,poisonLevel:0,poisonClock:.5,poisonProjectiles:1,poisonPierce:0,poisonDamageBonus:1,poisonSize:5,poisonDurationBonus:1,poisonRateBonus:1,droneLevel:0,droneClock:.3,droneProjectiles:1,dronePierce:0,droneDamageBonus:1,droneSize:4,droneRateBonus:1,evolved:{},evolvedLevels:{},choiceBonus:0,rerollsMax:0,rerollsLeft:0,level:1,xp:0,xpNext:25};
enemies=[];shots=[];enemyShots=[];xps=[];particles=[];orbs=[];shockwaves=[];effects=[];bosses=[];chests=[];cameraX=player.x-W/2;cameraY=player.y-H/2;obstacles=[];generatedChunks=new Set();lastChunkKey='';ensureWorldChunks(true);}
function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}
function hide(){overlay.classList.add('hidden')}
function setGameSpeed(speed){gameSpeed=clamp(Number(speed)||1,1,4);document.querySelectorAll('.speed-btn').forEach(btn=>{const active=Number(btn.dataset.speed)===gameSpeed;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));});}
function startGame(){initRun();mode='playing';hide();last=performance.now();beep(660,.1,'triangle',.03);}

function applyWeaponUpgrade(p,id){
 const key=id==='orbit'?'orbit':id+'Level';
 const next=p[key]+1;
 p[key]=next;
 if(id==='orbit'){
  if(next===2)p.orbitDamageBonus*=1.3;
  if(next===3){p.orbitSizeBonus*=1.25;p.orbitRangeBonus*=1.15;}
  if(next===4)p.orbitDamageBonus*=1.3;
  if(next===5){p.orbitRangeBonus*=1.25;p.orbitDamageBonus*=1.25;}
 }else if(id==='fireball'){
  if(next===2)p.fireballProjectiles=Math.min(3,p.fireballProjectiles+1);
  if(next===3)p.fireballDamageBonus*=1.3;
  if(next===4){p.fireballAreaBonus*=1.25;p.fireballSize*=1.25;}
  if(next===5){p.fireballProjectiles=Math.min(3,p.fireballProjectiles+1);p.fireballDamageBonus*=1.15;}
 }else if(id==='lightning'){
  if(next===2)p.lightningExtraChains++;
  if(next===3)p.lightningDamageBonus*=1.3;
  if(next===4)p.lightningRateBonus*=.8;
  if(next===5){p.lightningDamageBonus*=1.25;p.lightningExtraChains++;}
 }else if(id==='frost'){
  if(next===2)p.frostDamageBonus*=1.3;
  if(next===3)p.frostAreaBonus*=1.22;
  if(next===4)p.frostSlowBonus*=1.35;
  if(next===5){p.frostRateBonus*=.78;p.frostDamageBonus*=1.15;}
 }else if(id==='poison'){
  if(next===2)p.poisonProjectiles=Math.min(3,p.poisonProjectiles+1);
  if(next===3)p.poisonDamageBonus*=1.5;
  if(next===4)p.poisonPierce++;
  if(next===5){p.poisonDurationBonus*=1.35;p.poisonSize*=1.35;p.poisonRateBonus*=.8;}
 }else if(id==='drone'){
  if(next===2)p.droneDamageBonus*=1.3;
  if(next===3)p.droneProjectiles=Math.min(3,p.droneProjectiles+1);
  if(next===4){p.droneSize*=1.3;p.dronePierce++;}
  if(next===5){p.droneRateBonus*=.75;p.droneDamageBonus*=1.2;}
 }
}

function evolveWeapon(id){
 if(!player.evolved)player.evolved={};
 if(player.evolved[id]||weaponLevel(id)<5)return false;
 player.evolved[id]=true;
 if(!player.evolvedLevels)player.evolvedLevels={};
 player.evolvedLevels[id]=0;
 if(id==='orbit'){player.orbitDamageBonus*=1.8;player.orbitSizeBonus*=1.35;player.orbitRangeBonus*=1.25;}
 else if(id==='fireball'){player.fireballDamageBonus*=1.7;player.fireballAreaBonus*=1.45;player.fireballRateBonus*=.68;player.fireballProjectiles=Math.min(5,player.fireballProjectiles+1);}
 else if(id==='lightning'){player.lightningRange*=1.75;player.lightningDamageBonus*=1.25;player.lightningExtraChains+=1;player.lightningRateBonus*=.9;}
 else if(id==='frost'){player.frostDamageBonus*=1.75;player.frostAreaBonus*=1.4;player.frostSlowBonus*=1.5;player.frostRateBonus*=.68;}
 else if(id==='poison'){player.poisonDamageBonus*=1.9;player.poisonDurationBonus*=1.6;player.poisonPierce+=2;player.poisonSize*=1.3;player.poisonProjectiles=Math.min(5,player.poisonProjectiles+1);}
 else if(id==='drone'){player.droneDamageBonus*=1.8;player.dronePierce+=2;player.droneRateBonus*=.65;player.droneProjectiles=Math.min(5,player.droneProjectiles+1);player.droneSize*=1.25;}
 return true;
}

 return desc[id]||'進化武器の性能が少し上昇する。';

function enterEndless(){endlessMode=true;mode='playing';hide();announce('ENDLESS MODE');last=performance.now();beep(720,.16,'triangle',.035);}
function openChest(chest){
 burst(chest.x,chest.y,'#ffd879',28);sfxChest();
 // Endless treasure uses the same three-choice pool and selection behavior as level-ups.
 if(endlessMode){
  showUpgradeSelection('chest');
  return;
 }
 const eligible=weaponIds.filter(id=>weaponLevel(id)>=5&&!(player.evolved&&player.evolved[id]));
 let title='',desc='',tag='TREASURE CHEST',icon='🎁';
 if(eligible.length){
  // A max-level pre-evolution weapon always takes priority and evolves at most one per chest.
  const id=eligible[Math.floor(Math.random()*eligible.length)];
  evolveWeapon(id);title=weaponEvolutions[id].name;desc=`${weaponName(id)}が進化！${weaponEvolutions[id].desc}`;tag='WEAPON EVOLUTION';icon='✨';
 }else{
  // Prefer strengthening a weapon already owned before offering a new weapon.
  const owned=weaponIds.filter(id=>weaponLevel(id)>0&&weaponLevel(id)<5&&!(player.evolved&&player.evolved[id]));
  const unowned=weaponIds.filter(id=>weaponLevel(id)===0&&!(player.evolved&&player.evolved[id]));
  const available=owned.length?owned:unowned;
  if(available.length){
   const id=available[Math.floor(Math.random()*available.length)],before=weaponLevel(id);
   applyWeaponUpgrade(player,id);
   const after=weaponLevel(id);
   title=before===0?`${weaponName(id)}を獲得`:`${weaponName(id)}を強化`;
   desc=`${weaponName(id)}：レベル ${before} → ${after}。`;
   if(after===5)desc+=' レベル5に到達しましたが、この宝箱では進化しません。次のボス宝箱で進化候補になります。';
   tag=`WEAPON / LV.${after}`;icon='⚔️';
  }else{
   player.maxHp+=20;player.hp=player.maxHp;score+=250;
   title='宝箱の祝福';desc='進化可能な武器が残っていません。最大HPが20増加し、HPが全回復しました。';tag='MASTERED REWARD';icon='💎';
  }
 }
 mode='chest';
 show(`<div class="eyebrow">BOSS TREASURE</div><h1>${icon} 宝箱を開封！</h1><div class="upgrade" style="margin-top:16px;text-align:center;min-height:0"><span class="ico">${icon}</span><strong>${title}</strong><small>${desc}</small><span class="tag">${tag}</span></div><button class="primary" id="chestContinue" style="margin-top:16px">報酬を受け取って続ける</button><div class="footnote">宝箱を開けている間、ゲーム内時間は停止します。</div>`);
 document.getElementById('chestContinue').onclick=()=>{mode='playing';hide();last=performance.now()};
}

function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(mode==='playing'){const scaledDt=dt*gameSpeed,steps=Math.max(1,Math.ceil(scaledDt/.025)),stepDt=scaledDt/steps;for(let i=0;i<steps&&mode==='playing';i++)update(stepDt)}draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='p'){if(mode==='playing')pauseGame();else if(mode==='paused'){mode='playing';hide();last=performance.now()}}if(k===' '&&mode==='playing'&&player.dashCd<=0){player.dashTime=.16;player.dashCd=player.dashCooldown;player.invuln=Math.max(player.invuln,.22);burst(player.x,player.y,'#7defff',7);beep(250,.06,'sawtooth',.02)}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();if(mode==='playing')pauseGame()});
function triggerDash(){if(mode==='playing'&&player.dashCd<=0){player.dashTime=.16;player.dashCd=player.dashCooldown;player.invuln=Math.max(player.invuln,.22);burst(player.x,player.y,'#7defff',7);beep(250,.06,'sawtooth',.02);}}
// Desktop mouse click remains a quick dash; mobile uses the dedicated button.
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')triggerDash();});
const joystick=document.getElementById('joystick'),stickKnob=document.getElementById('stickKnob');
function moveStick(e){const rect=joystick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let x=e.clientX-cx,y=e.clientY-cy;const max=38,mag=Math.hypot(x,y)||1;if(mag>max){x=x/mag*max;y=y/mag*max;}touchAxisX=x/max;touchAxisY=y/max;stickKnob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;}
joystick.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();joystickPointerId=e.pointerId;try{joystick.setPointerCapture(e.pointerId)}catch(_){}moveStick(e)});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joystickPointerId){e.preventDefault();moveStick(e)}});
function resetStick(e){if(e.pointerId!==joystickPointerId)return;joystickPointerId=null;touchAxisX=0;touchAxisY=0;stickKnob.style.transform='translate(-50%,-50%)';}
joystick.addEventListener('pointerup',resetStick);joystick.addEventListener('pointercancel',resetStick);joystick.addEventListener('lostpointercapture',()=>{joystickPointerId=null;touchAxisX=0;touchAxisY=0;stickKnob.style.transform='translate(-50%,-50%)'});
document.getElementById('dashTouch').addEventListener('pointerdown',e=>{e.preventDefault();triggerDash()});
document.getElementById('pauseTouch').addEventListener('click',()=>{if(mode==='playing')pauseGame();else if(mode==='paused'){mode='playing';hide();last=performance.now()}});
document.querySelectorAll('.speed-btn').forEach(btn=>btn.addEventListener('click',()=>setGameSpeed(btn.dataset.speed)));setGameSpeed(1);initRun();menuScreen();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
